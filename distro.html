	<style>
		:root { color-scheme: dark; --bg: #101410; --panel: rgba(255,255,255,.055); --line: rgba(234,242,224,.12); --text: #eef1e8; --muted: #a1aa9b; --lime: #c5f36b; --orange: #f0a36b; --mono: "DM Mono", monospace; --sans: "Manrope", "Segoe UI", sans-serif; }
		* { box-sizing: border-box; }
		html { scroll-behavior: smooth; }
		body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.7 var(--sans); }
		body::before { position: fixed; inset: 0; z-index: -1; content: ""; pointer-events: none; background: radial-gradient(ellipse at 78% 6%, rgba(139,171,76,.12), transparent 34%), radial-gradient(ellipse at 7% 37%, rgba(90,122,84,.08), transparent 28%); }
		a { color: inherit; text-decoration: none; }
		.topbar { position: sticky; top: 0; z-index: 5; height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 5vw; border-bottom: 1px solid var(--line); background: rgba(16,20,16,.82); backdrop-filter: blur(18px); }
		.brand { display: inline-flex; align-items: center; gap: 11px; font-size: 13px; font-weight: 800; white-space: nowrap; }
		.brand-mark { display: grid; width: 31px; height: 31px; place-items: center; border-radius: 8px; background: var(--lime); color: #17200d; font: 500 13px var(--mono); }
		.back-link { color: #c0c9b8; font-size: 12px; }
		.back-link:hover { color: var(--lime); }
		main { width: min(100% - 48px, 1050px); margin: 0 auto; }
		.hero { position: relative; min-height: 390px; display: flex; align-items: end; overflow: hidden; margin: 34px 0 47px; border: 1px solid rgba(234,242,224,.17); border-radius: 12px; background: #252b22 url("https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1800&q=85") center 44% / cover; }
		.hero::before { position: absolute; inset: 0; content: ""; background: linear-gradient(90deg, rgba(12,16,12,.94), rgba(12,16,12,.55) 68%, rgba(12,16,12,.16)), linear-gradient(0deg, rgba(12,16,12,.75), transparent 70%); }
		.hero-copy { position: relative; width: 100%; padding: clamp(25px, 6vw, 62px); }
		.eyebrow, .index { color: var(--lime); font: 10px var(--mono); letter-spacing: .09em; text-transform: uppercase; }
		h1, h2, h3, p { margin-top: 0; }
		h1 { max-width: 760px; margin: 17px 0 12px; font-size: clamp(38px, 7vw, 72px); line-height: 1.04; }
		.family { color: #d4ddca; font: 11px var(--mono); }
		.lead { max-width: 700px; margin: 16px 0 0; color: #d0d7ca; font-size: 14px; }
		.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 55px; }
		.fact, .panel { border: 1px solid var(--line); border-radius: 8px; background: linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.025)); }
		.fact { min-height: 107px; padding: 16px; }
		.fact span { display: block; margin-bottom: 8px; color: #879181; font: 9px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
		.fact strong { display: block; color: #dce4d6; font-size: 12px; font-weight: 600; }
		.section-head { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 18px; }
		h2 { margin: 7px 0 0; font-size: clamp(25px, 4vw, 34px); line-height: 1.2; }
		.section-intro { max-width: 390px; margin: 0; color: var(--muted); font-size: 12px; }
		.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 54px; }
		.panel { padding: 20px; }
		.panel h3 { margin: 0 0 9px; font-size: 14px; }
		.panel p { margin: 0; color: #b8c1b1; font-size: 12px; }
		.panel.accent { border-top: 2px solid var(--lime); }
		.panel.caution { border-top: 2px solid var(--orange); }
		.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 53px; }
		.step { padding: 15px; border-top: 1px solid var(--lime); color: #b8c1b1; font-size: 11px; }
		.step b { display: block; margin-bottom: 7px; color: var(--lime); font: 10px var(--mono); }
		.related { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
		.related a { padding: 7px 10px; border: 1px solid var(--line); border-radius: 4px; color: #c5cebd; font-size: 11px; }
		.related a:hover { border-color: var(--lime); color: var(--lime); }
		.footer { display: flex; justify-content: space-between; gap: 20px; margin: 54px 0 28px; padding-top: 16px; border-top: 1px solid var(--line); color: #7f897b; font: 9px var(--mono); }
		.error { min-height: 60vh; display: grid; align-content: center; }
		.error h1 { font-size: 42px; }
		@media (max-width: 650px) { .topbar { height: 58px; padding: 0 18px; } .brand { font-size: 11px; } main { width: calc(100% - 36px); } .hero { min-height: 380px; margin: 20px 0 35px; background-position: 58% center; } .hero::before { background: linear-gradient(90deg, rgba(12,16,12,.89), rgba(12,16,12,.44)), linear-gradient(0deg, rgba(12,16,12,.86), transparent 90%); } .facts { grid-template-columns: 1fr; margin-bottom: 42px; } .fact { min-height: 0; } .section-head { display: block; } .section-intro { margin-top: 9px; } .detail-grid { grid-template-columns: 1fr; margin-bottom: 42px; } .steps { grid-template-columns: 1fr; margin-bottom: 42px; } .footer { display: block; line-height: 2; } }
		@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
	</style>

	<script>
		const profiles = [
			{ name: 'Linux Mint', family: 'Ubuntu / Debian', intro: 'Удобный настольный Linux с привычной логикой меню, панели и окон. Mint ориентирован на тех, кто хочет получить готовую систему без обязательной ручной настройки.', model: 'Фиксированные выпуски на базе Ubuntu LTS; отдельная редакция LMDE основана непосредственно на Debian. Перед установкой стоит проверить актуальный цикл поддержки выбранного выпуска.', packages: 'Основной источник программ — репозитории Ubuntu или Debian, управление пакетами через APT. Есть графический менеджер программ и собственные Mint-инструменты настройки.', desktop: 'Cinnamon — основная и наиболее узнаваемая редакция; также доступны более лёгкие MATE и Xfce. В поставку входят инструменты обновления, резервного копирования и настройки драйверов.', strengths: 'Знакомый интерфейс, понятная установка, широкая документация Ubuntu и умеренные требования Cinnamon. Хорошо подходит как первый Linux на домашнем компьютере.', cautions: 'Пакеты в стабильной базе могут быть старше, чем в быстро обновляемых системах. Некоторые проприетарные форматы и игровые сценарии требуют отдельной настройки.', start: 'Запустите live-USB и проверьте Wi-Fi, звук, сон, графику и масштабирование. Для повседневного ПК начните с Cinnamon; для старого ноутбука сравните MATE или Xfce.', related: [2, 7, 15] },
			{ name: 'Ubuntu', family: 'Debian', intro: 'Один из самых распространённых Linux-дистрибутивов для настольных компьютеров, серверов и облаков. Ubuntu предлагает готовую интегрированную систему и большую экосистему инструкций.', model: 'Фиксированные релизы выходят регулярно; LTS-выпуски получают длительную поддержку. Между версиями можно обновляться штатными средствами, но перед переходом полезна резервная копия.', packages: 'APT и пакеты DEB из репозиториев Ubuntu; также широко используются Snap и Flatpak. Для разработки и серверов доступны официальные репозитории и облачные образы.', desktop: 'Стандартная редакция использует GNOME с настройками Ubuntu. Большой выбор официальных вариантов включает Kubuntu, Xubuntu и Lubuntu с другими рабочими столами.', strengths: 'Широкая поддержка оборудования и ПО, понятная документация, много учебных материалов и простая установка. Хороший общий выбор для рабочего компьютера и разработки.', cautions: 'Snap используется в некоторых стандартных сценариях и нравится не всем. Частые промежуточные релизы требуют обновления чаще, чем LTS; некоторые драйверы закрыты.', start: 'Если важна предсказуемость, выбирайте актуальный LTS-выпуск. Проверьте совместимость устройств в live-сессии и заранее решите, как будете устанавливать приложения: APT, Snap или Flatpak.', related: [1, 3, 17] },
			{ name: 'Fedora Workstation', family: 'RPM / Red Hat', intro: 'Современный настольный дистрибутив сообщества Fedora. Он быстро включает новые версии ядра, графического стека и инструментов, сохраняя целостную конфигурацию для разработчиков и обычного desktop.', model: 'Фиксированные выпуски с относительно коротким сроком сопровождения и переходом на новые версии примерно раз в полгода. Это не rolling-релиз: систему обновляют между выпусками.', packages: 'RPM-пакеты управляются DNF. Дополнительные кодеки и проприетарное ПО могут требовать стороннего репозитория; Flatpak широко применяется для графических приложений.', desktop: 'Основная редакция поставляется с GNOME и современным Wayland-сеансом. Fedora Spins дают официальные варианты с KDE Plasma, Xfce, Cinnamon и другими средами.', strengths: 'Свежие компиляторы и библиотеки, близость к upstream-проектам, хорошие средства контейнерной разработки и актуальная поддержка оборудования.', cautions: 'Из-за короткого цикла поддержки обновляться нужно регулярно. Некоторые кодеки и проприетарные драйверы не включены в базовую установку.', start: 'Попробуйте live-образ и убедитесь, что важные периферийные устройства работают. Для NVIDIA или мультимедийных кодеков изучите поддерживаемые Fedora способы установки после первого запуска.', related: [18, 19, 20] },
			{ name: 'Arch Linux', family: 'Независимый', intro: 'Минималистичный rolling-дистрибутив для тех, кто хочет собрать систему из выбранных компонентов и понимать её устройство. Arch устанавливает немного готовых решений и не скрывает конфигурацию.', model: 'Непрерывные обновления из репозиториев без отдельных крупных версий. Иногда обновление требует прочитать объявления проекта и выполнить дополнительные действия вручную.', packages: 'Pacman управляет бинарными пакетами; AUR содержит пользовательские рецепты сборки и требует проверки перед использованием. Официальная ArchWiki известна подробной документацией.', desktop: 'Установщик позволяет выбрать ядро, среду, загрузчик и службы. KDE, GNOME, тайловые оконные менеджеры и серверные конфигурации собираются отдельно.', strengths: 'Большой контроль, актуальные версии ПО, сильная документация и возможность получить ровно ту систему, которая нужна.', cautions: 'Нужно самостоятельно обслуживать систему, разбираться с загрузкой и читать новости обновлений. AUR-пакеты не являются официально проверенными бинарными пакетами.', start: 'Сначала изучите официальную инструкцию установки и ArchWiki. Делайте резервные копии, обновляйте систему согласованно и не выполняйте вслепую команды из случайных руководств.', related: [26, 27, 29] },
			{ name: 'Debian', family: 'DEB', intro: 'Независимый общественный проект и основа множества других дистрибутивов. Debian ценят за широкий выбор архитектур, стабильную базу и пригодность как для серверов, так и для рабочих станций.', model: 'Стабильная ветка получает исправления и обновления безопасности; новые версии программ появляются преимущественно с новым выпуском. Есть testing и unstable для более новых пакетов.', packages: 'Формат DEB и менеджеры APT/dpkg. Официальный установщик позволяет выбрать набор программ; прошивки и несвободные компоненты доступны в соответствии с текущей политикой проекта.', desktop: 'Можно выбрать GNOME, KDE Plasma, Xfce, Cinnamon и другие среды. Минимальная установка хорошо подходит для сервера, а готовый desktop настраивается при установке.', strengths: 'Предсказуемость стабильной ветки, независимое управление проектом, большое число пакетов и долгий опыт эксплуатации в инфраструктуре.', cautions: 'В stable-ветке версии ПО консервативны. Установка некоторых Wi-Fi-адаптеров и видеокарт может потребовать подходящей прошивки или драйвера.', start: 'Для рабочего компьютера выбирайте стабильный выпуск и включите только необходимые источники пакетов. Проверяйте наличие firmware для своей модели ноутбука в live-среде или при установке.', related: [1, 2, 35] },
			{ name: 'openSUSE Tumbleweed', family: 'RPM / SUSE', intro: 'Полноценный rolling-дистрибутив openSUSE, объединяющий свежие пакеты с автоматической проверкой сборок. Он подходит пользователям, которым нужны актуальные версии и инструменты администрирования.', model: 'Непрерывно обновляемая система. Публикуемые снимки проходят автоматические тесты openQA; это снижает риск, но не отменяет необходимость резервных копий и чтения примечаний.', packages: 'RPM управляется Zypper; графические системные настройки доступны через YaST. Репозитории содержат широкий выбор desktop- и серверного ПО.', desktop: 'Официальные образы предлагают KDE Plasma и GNOME, возможна установка других сред. Btrfs со снимками часто используется как часть стандартной конфигурации.', strengths: 'Свежий стек, сильные средства администрирования и возможность отката к снимку при неудачном обновлении, если снимки настроены и доступны.', cautions: 'Большие обновления могут быть частыми и занимать время; снимки требуют места. Сторонние репозитории могут нарушить согласованность пакетов.', start: 'Убедитесь, что на диске достаточно места для снимков. Обновляйтесь штатным способом, делайте резервные копии важных данных и не смешивайте без необходимости несовместимые репозитории.', related: [25, 24, 3] },
			{ name: 'Lubuntu', family: 'Ubuntu', intro: 'Официальный вариант Ubuntu с рабочим столом LXQt. Он предлагает знакомую базу Ubuntu в более лёгкой графической оболочке для компактных систем и пользователей, которым нужен простой desktop.', model: 'Следует графику выпусков Ubuntu: доступны промежуточные и LTS-версии с соответствующими сроками поддержки. Проверяйте срок поддержки конкретного выпуска.', packages: 'Используются репозитории Ubuntu, APT и форматы DEB; доступны стандартные инструменты установки программ Ubuntu.', desktop: 'LXQt — модульная среда на Qt с панелью, меню и настройками. Это полноценный desktop, хотя набор предустановленных приложений отличается от стандартной Ubuntu.', strengths: 'Относительно скромные требования к ресурсам, привычный рабочий процесс и совместимость с экосистемой Ubuntu.', cautions: 'Новая лёгкая среда не исправит нехватку памяти или неисправный накопитель; реальная нагрузка зависит от браузера и приложений. Некоторые элементы интерфейса выглядят иначе, чем в GNOME.', start: 'Проверьте live-образ на целевом компьютере и оцените скорость браузера с реальными вкладками. Для очень старого оборудования сравните также antiX или Puppy Linux.', related: [15, 37, 1] },
			{ name: 'NixOS', family: 'Независимый', intro: 'Дистрибутив, где большая часть конфигурации системы описывается декларативно. NixOS строит систему из конфигурации, что упрощает воспроизведение настроек и откат к предыдущему поколению.', model: 'Фиксированные каналы обновления; есть стабильные ветки и более быстро меняющийся канал. Обновление конфигурации создаёт новое поколение, к которому можно вернуться.', packages: 'Пакетный менеджер Nix использует функциональную модель сборок и хранилище с версиями. Конфигурация обычно задаётся в Nix-файлах; доступен большой репозиторий nixpkgs.', desktop: 'Можно установить GNOME, KDE Plasma и другие среды, но системные службы, пользователи и многие параметры настраиваются через декларативную конфигурацию.', strengths: 'Повторяемые настройки, атомарные обновления поколений, удобный откат и возможность держать разные версии инструментов разработки.', cautions: 'Язык конфигурации и модель Nix отличаются от привычных менеджеров пакетов. Некоторые программы ожидают стандартные файловые пути и требуют дополнительных настроек.', start: 'Начните с официального руководства и сохраните исходный конфигурационный файл в системе контроля версий. Меняйте конфигурацию небольшими шагами и проверяйте результат сборки до переключения.', related: [4, 8, 19] },
			{ name: 'Bazzite', family: 'Fedora Atomic', intro: 'Настольная система на основе Fedora Atomic, подготовленная для игр и мультимедиа. Она поставляется с настройками и инструментами, которые сокращают путь от установки до использования Steam.', model: 'Образная система с атомарными обновлениями и откатом к предыдущему состоянию. Это специализированный проект: следите за документацией выпуска и совместимостью конкретной модели устройства.', packages: 'Базовая система обновляется как образ; графические приложения обычно устанавливаются в изолированном формате Flatpak. Для дополнительных системных пакетов используются контейнерные или поддерживаемые проектом механизмы.', desktop: 'Предлагаются варианты для обычного desktop и игровых устройств, включая редакции с KDE Plasma или GNOME. Состав и настройки зависят от выбранного образа.', strengths: 'Игровая интеграция, атомарное обновление и готовые настройки, особенно полезные для Steam и контроллеров.', cautions: 'Это не универсальная замена классической Fedora для каждого сценария. Изменения базовой системы устроены иначе, а отдельные античиты и игры всё равно могут не работать.', start: 'Выберите образ для точного типа устройства, проверьте совместимость игр и периферии и прочитайте рекомендации Bazzite перед добавлением системных пакетов.', related: [3, 49, 10] },
			{ name: 'Pop!_OS', family: 'Ubuntu', intro: 'Настольный дистрибутив System76 на базе Ubuntu, ориентированный на продуктивную работу, разработку и игры. Важная особенность проекта — интеграция системы с компьютерами производителя.', model: 'Фиксированные выпуски, основанные на Ubuntu; график и поддержка зависят от текущего выпуска Pop!_OS. Проверяйте официальные заметки проекта перед обновлением.', packages: 'База Ubuntu и APT, собственные репозитории System76, а также Flatpak для приложений. Для компьютеров с NVIDIA доступны соответствующие образы и драйверы.', desktop: 'Существующие выпуски основаны на GNOME с дополнениями Pop. Проект развивает собственную среду COSMIC; доступность и зрелость компонентов зависят от конкретной версии системы.', strengths: 'Готовые образы для разных видеокарт, удобная интеграция оборудования System76 и ориентированные на клавиатуру функции рабочего стола.', cautions: 'Часть преимуществ особенно заметна на оборудовании System76. Изменения собственной среды и график перехода на неё стоит сверять с текущими релизами.', start: 'Проверьте, что образ соответствует видеокарте, и сверяйте инструкции с текущей версией Pop!_OS. На компьютере другого производителя отдельно протестируйте сон, Wi-Fi и графику.', related: [2, 9, 17] },
			{ name: 'Zorin OS', family: 'Ubuntu', intro: 'Настольный дистрибутив для перехода на Linux с привычной организацией рабочего стола. Zorin делает акцент на цельном интерфейсе и готовых вариантах оформления.', model: 'Фиксированные выпуски на базе Ubuntu LTS; между крупными версиями действует срок поддержки базового выпуска. Перед выбором проверьте актуальную таблицу поддержки.', packages: 'Используются APT и репозитории Ubuntu, доступны Flatpak и дополнительные источники программ. Состав доступных редакций и функций может отличаться.', desktop: 'Среда основана на GNOME и настраивается под разные раскладки интерфейса. Визуальные настройки позволяют приблизить панель и меню к знакомым пользователю шаблонам.', strengths: 'Невысокий порог входа, аккуратная интеграция базовых приложений и понятный интерфейс для повседневных задач.', cautions: 'Некоторые дополнительные оформления или возможности могут зависеть от редакции. Совместимость программ Windows не гарантируется одним лишь интерфейсом.', start: 'Сначала попробуйте бесплатный вариант в live-сессии и проверьте нужные приложения. Если переходите с Windows, заранее составьте список файловых форматов и программ, от которых зависите.', related: [1, 12, 14] },
			{ name: 'elementary OS', family: 'Ubuntu', intro: 'Настольная система с собственным визуальным языком, приложениями и центром приложений. elementary стремится к согласованному и сдержанному пользовательскому опыту.', model: 'Фиксированные выпуски на базе Ubuntu LTS. Срок поддержки связан с базовой платформой и политикой проекта; проверяйте, какая версия сейчас поддерживается.', packages: 'Базовые DEB-пакеты и APT дополняются AppCenter и Flatpak. Приложения elementary могут следовать собственным рекомендациям по интерфейсу.', desktop: 'Pantheon сочетает док, верхнюю панель и системные настройки в единой среде. Лучше всего ощущается в штатной конфигурации, хотя технически система остаётся настраиваемой.', strengths: 'Цельность интерфейса, аккуратные приложения и умеренное количество визуальных отвлекающих элементов.', cautions: 'Экосистема собственных приложений меньше, чем у GNOME или KDE. Пользователям, которым нужны глубокая настройка и широкий выбор системных панелей, среда может показаться ограниченной.', start: 'Проверьте нужные приложения и подключение учётных записей в live-режиме. Перед установкой убедитесь, что текущий выпуск подходит по поддержке и совместимости с устройствами.', related: [12, 1, 14] },
			{ name: 'KDE neon', family: 'Ubuntu', intro: 'Система для пользователей KDE: стабильная база Ubuntu LTS сочетается с быстро обновляемыми компонентами KDE. Проект в первую очередь показывает актуальное состояние Plasma и приложений KDE.', model: 'Основа Ubuntu LTS, поверх которой регулярно обновляется программный стек KDE. Это не обычный вариант Ubuntu с одинаковым циклом для всех компонентов.', packages: 'Ubuntu APT-репозитории обеспечивают базу; пакеты Plasma и KDE приходят из репозиториев проекта. Flatpak также можно использовать для приложений.', desktop: 'KDE Plasma — центральная часть системы: панели, виджеты, сочетания клавиш и внешний вид широко настраиваются.', strengths: 'Быстрый доступ к новым версиям Plasma при привычной Ubuntu-базе и удобный путь попробовать KDE на современной системе.', cautions: 'Новые компоненты KDE обновляются отдельно от базовой Ubuntu, поэтому система не равна консервативному LTS desktop. Это не специализированный дистрибутив с поддержкой всех сценариев Ubuntu.', start: 'Если нужна максимально консервативная система, сравните с Kubuntu. Если важны новые функции KDE, установите neon и внимательно проверяйте сообщения об обновлениях.', related: [14, 18, 2] },
			{ name: 'Kubuntu', family: 'Ubuntu', intro: 'Официальный вариант Ubuntu с рабочим столом KDE Plasma. Он совмещает стандартную инфраструктуру Ubuntu с гибкой средой, которую можно настроить под классический или необычный рабочий процесс.', model: 'Следует графику и срокам поддержки Ubuntu, включая LTS-выпуски. Переходы между выпусками выполняются штатными инструментами Ubuntu.', packages: 'APT и репозитории Ubuntu; доступны DEB, Snap и Flatpak. Приложения KDE интегрированы с Plasma и системными настройками.', desktop: 'KDE Plasma даёт панели, виджеты, виртуальные рабочие столы и широкие настройки. Набор приложений отличается от стандартной редакции Ubuntu.', strengths: 'Знакомая Ubuntu-база, большое количество настроек и широкий выбор KDE-программ.', cautions: 'Богатство параметров может потребовать времени на освоение. Для отдельных приложений из других сред могут понадобиться дополнительные библиотеки.', start: 'Попробуйте live-образ и настройте панель только после освоения стандартной конфигурации. Для длительной поддержки выбирайте актуальную LTS-версию Kubuntu.', related: [13, 18, 1] },
			{ name: 'Xubuntu', family: 'Ubuntu', intro: 'Официальный вариант Ubuntu с Xfce. Он предлагает традиционный desktop с панелями и меню, при этом оставаясь гибким и обычно менее требовательным к ресурсам, чем крупные среды.', model: 'Выпуски синхронизированы с Ubuntu. Уточняйте срок поддержки конкретной версии: он зависит от того, является ли выпуск LTS и от политики сопровождения Xubuntu.', packages: 'APT и репозитории Ubuntu; доступны стандартные Ubuntu-программы, Flatpak и другие поддерживаемые форматы.', desktop: 'Xfce состоит из панелей, файлового менеджера Thunar и набора небольших утилит. Компоненты можно менять независимо, не теряя привычную структуру desktop.', strengths: 'Быстрый отклик на скромном оборудовании, традиционная организация интерфейса и совместимость с Ubuntu-экосистемой.', cautions: 'Лёгкая среда не гарантирует ускорения тяжёлых сайтов или современных игр. Внешний вид некоторых приложений может отличаться из-за смешения GTK- и Qt-программ.', start: 'Загрузите live-образ на целевом компьютере и проверьте сон, Wi-Fi и видео. Сравните фактическую нагрузку с Lubuntu, если у устройства особенно мало памяти.', related: [7, 1, 35] },
			{ name: 'Ubuntu Studio', family: 'Ubuntu', intro: 'Вариант Ubuntu с приложениями и настройками для создания аудио, видео, графики и контента. Он экономит время на первичном подборе творческих инструментов.', model: 'Основан на цикле Ubuntu; LTS-выпуски подходят для более долгого рабочего периода. Проверяйте, какие версии медиапакетов включены в конкретный релиз.', packages: 'APT и репозитории Ubuntu; поставляется большой набор редакторов и плагинов. Дополнительные программы можно устанавливать из поддерживаемых источников.', desktop: 'Использует KDE Plasma и специализированные настройки рабочего стола. Для низкой задержки звука важны конфигурация PipeWire/JACK и аппаратные интерфейсы.', strengths: 'Готовая подборка приложений для цифрового творчества, хорошая база Ubuntu и меньше начальной ручной настройки.', cautions: 'Набор программ занимает место, а профессиональная совместимость зависит от конкретного оборудования, кодеков и форматов проекта. Не все коммерческие приложения имеют Linux-версию.', start: 'Перед переездом откройте реальные проекты в нужных редакторах и проверьте аудиоинтерфейс, MIDI, GPU и плагины. Сделайте копии проектов и пресетов до экспериментов.', related: [2, 14, 3] },
			{ name: 'Ubuntu Server', family: 'Ubuntu', intro: 'Серверная редакция Ubuntu без обязательного графического рабочего стола. Она предназначена для виртуальных машин, физических серверов, облаков и домашних сервисов.', model: 'Доступны LTS-релизы с длительной поддержкой и промежуточные версии. Поддержку конкретного выпуска и расширенные варианты обслуживания сверяйте с официальным циклом Ubuntu.', packages: 'APT управляет системными пакетами; cloud-init, snap и контейнерные инструменты применяются в зависимости от образа и задачи. Обновления безопасности публикуются через репозитории.', desktop: 'По умолчанию графическая оболочка не нужна: сервером управляют через SSH и консоль. При необходимости desktop устанавливается отдельно, но увеличивает поверхность обслуживания.', strengths: 'Большой выбор серверных инструкций, облачных образов и пакетов для веб-сервисов, баз данных и контейнеров.', cautions: 'Публичный сервер нужно обновлять, ограничивать сетевые службы, настраивать резервное копирование и доступ по ключам. Сам по себе дистрибутив не обеспечивает безопасную конфигурацию.', start: 'Начните с минимального образа, настройте пользователя с sudo и SSH-ключи, затем откройте только необходимые порты. Сначала проверьте процедуру восстановления и резервных копий.', related: [5, 20, 21] },
			{ name: 'Fedora KDE Plasma Desktop', family: 'RPM / Red Hat', intro: 'Официальная Fedora с KDE Plasma вместо GNOME по умолчанию. Подходит тем, кому нужны свежие системные компоненты Fedora и настраиваемый рабочий стол KDE.', model: 'Фиксированные релизы Fedora с частыми обновлениями и ограниченным сроком поддержки каждого выпуска. Планируйте своевременный переход на следующую поддерживаемую версию.', packages: 'RPM и DNF; Flatpak доступен для desktop-приложений. Для некоторых кодеков или проприетарных компонентов могут потребоваться дополнительные источники.', desktop: 'KDE Plasma и приложения KDE настроены как интегрированный desktop. Wayland является важной частью современного графического стека, но можно проверить доступные сеансы и совместимость оборудования.', strengths: 'Свежая Plasma, новые версии ядра и инструментов разработки, а также официальная поддержка Fedora.', cautions: 'Нужно обновляться в пределах срока поддержки Fedora. Проприетарные кодеки и отдельные драйверы могут потребовать ручного включения дополнительных репозиториев.', start: 'Проверьте периферийные устройства в live-среде. Если вы переходите с Kubuntu, учтите различия DNF/RPM и более короткий цикл Fedora.', related: [3, 14, 19] },
			{ name: 'Fedora Silverblue', family: 'Fedora Atomic', intro: 'Настольная Fedora с неизменяемой базовой системой и образной моделью обновлений. Она рассчитана на атомарное обновление и откат, а приложения предлагает устанавливать отдельно от базового слоя.', model: 'Система обновляется целостными образами; можно загрузить предыдущее состояние после проблемного обновления. Поддержка следует циклу Fedora.', packages: 'Flatpak предназначен для графических приложений, Toolbox или Distrobox — для изолированных сред разработки. Наложение RPM-пакетов возможно, но не должно заменять штатную модель.', desktop: 'Поставляется с GNOME. Близкий вариант Fedora Kinoite использует KDE Plasma; атомарная модель требует привыкания к разделению приложений и базовой системы.', strengths: 'Воспроизводимые обновления, откат и удобное разделение рабочих окружений через контейнеры.', cautions: 'Системные изменения устроены иначе, чем в классической Fedora. Некоторые инструкции, предполагающие ручную модификацию корневой системы, здесь неприменимы.', start: 'Перед установкой проверьте доступность нужных приложений во Flatpak или контейнерах. Сначала попробуйте штатный workflow, а не переносите привычки управления пакетами один к одному.', related: [9, 25, 8] },
			{ name: 'Fedora Server', family: 'RPM / Red Hat', intro: 'Серверная редакция Fedora для современных серверных приложений и тестирования актуального стека. Она подходит там, где важны новые версии компонентов, а обновлять систему каждые несколько выпусков приемлемо.', model: 'Релизы Fedora поддерживаются ограниченное время по сравнению с серверными LTS-платформами. Для долгоживущих систем заранее планируйте регулярные переходы между выпусками.', packages: 'RPM и DNF; доступны серверные роли и инструменты управления, контейнеры и виртуализация. Конкретные службы устанавливаются из репозиториев по потребности.', desktop: 'Обычно работает без графического окружения и администрируется по SSH. Управление через Cockpit доступно как отдельный веб-инструмент.', strengths: 'Современные версии ядра, сетевого и контейнерного стека, тесная связь с экосистемой Red Hat.', cautions: 'Короткий срок поддержки требует дисциплины обновлений. Для длительно неизменяемых корпоративных нагрузок могут быть уместнее Rocky Linux, AlmaLinux или RHEL.', start: 'Сначала определите окно обслуживания и сценарий обновления. Закройте ненужные службы, настройте журналы и резервные копии и проверьте обновление на тестовой машине.', related: [20, 21, 23] },
			{ name: 'Rocky Linux', family: 'RHEL-compatible', intro: 'Дистрибутив сообщества, ориентированный на совместимость с экосистемой Red Hat Enterprise Linux. Его часто рассматривают для серверов, где нужен долгий цикл стабильной платформы.', model: 'Фиксированные корпоративные релизы с длительным сопровождением. Конкретные сроки поддержки и совместимость следует сверять с текущей политикой Rocky Linux.', packages: 'RPM и DNF; доступны корпоративные библиотеки, серверные инструменты и сборки для распространённых архитектур. Дополнительные репозитории требуют проверки происхождения.', desktop: 'Основная аудитория — серверы и рабочие нагрузки без графического desktop. Графическую среду можно установить, но она не является главным сценарием.', strengths: 'Предсказуемость, знакомые администраторам RHEL-инструменты и возможность размещать типовые серверные приложения.', cautions: 'Совместимость с RHEL не означает наличие поддержки от Red Hat. Для бизнеса заранее определите, кто будет отвечать за обновления и устранение инцидентов.', start: 'Сверьте требуемую версию совместимости и доступность пакетов. Испытайте восстановление из резервной копии и настройте безопасное удалённое администрирование.', related: [21, 23, 20] },
			{ name: 'AlmaLinux', family: 'RHEL-compatible', intro: 'Открытая корпоративная Linux-платформа, рассчитанная на серверы и совместимость с большим количеством ПО для RHEL-подобных систем.', model: 'Фиксированные ветки с продолжительной поддержкой. Политику совместимости и периоды сопровождения проверяйте для конкретного основного выпуска.', packages: 'RPM/DNF и совместимые серверные пакеты. Экосистема ориентирована на инструменты управления, веб-серверы, базы данных и корпоративное ПО.', desktop: 'Чаще устанавливается как минимальный сервер без графического интерфейса. Для администрирования подходят SSH и поддерживаемые средства управления.', strengths: 'Стабильная база и знакомый RPM-стек для организаций и хостингов, которым нужен RHEL-совместимый вариант.', cautions: 'Совместимость и сертификация не равны коммерческой поддержке вендора. Проверьте требования поставщика своего прикладного ПО.', start: 'Сверьте матрицу совместимости нужного приложения, настройте автоматизированные обновления безопасности и регулярно проверяйте восстановление серверов.', related: [20, 22, 23] },
			{ name: 'Red Hat Enterprise Linux', family: 'RPM / Red Hat', intro: 'Коммерческая корпоративная платформа Red Hat для серверов, облаков и сертифицированных рабочих нагрузок. Она сочетает стабильные релизы с официальными каналами поддержки и экосистемой инструментов управления.', model: 'Корпоративные основные версии с длительным жизненным циклом и поддерживаемыми потоками обновлений. Условия доступа к пакетам и поддержки зависят от подписки.', packages: 'RPM и DNF; используются репозитории Red Hat и корпоративные средства управления, включая Satellite в соответствующих сценариях.', desktop: 'Обычно эксплуатируется на серверах и в облаке. Доступны графические варианты, но основное внимание уделено управляемой инфраструктуре.', strengths: 'Вендорская поддержка, сертификации, документация и предсказуемость для организаций с формальными требованиями.', cautions: 'Нужна подписка для многих официальных сценариев поддержки и доступа. Программный стек намеренно консервативен относительно rolling-дистрибутивов.', start: 'До внедрения проверьте совместимость оборудования и приложений, модель подписки, политику патчей и требования аудита. Оцените жизненный цикл всей инфраструктуры, а не только ОС.', related: [20, 21, 22] },
			{ name: 'openSUSE Leap', family: 'RPM / SUSE', intro: 'Фиксированный выпуск openSUSE для пользователей, которым важны предсказуемые обновления и инструменты SUSE. Подходит для настольных компьютеров и серверов.', model: 'Фиксированные релизы с согласованной базой пакетов; цикл и политика поддержки зависят от текущего выпуска и связи с SUSE Linux Enterprise.', packages: 'RPM и Zypper; графическая утилита YaST помогает настраивать систему, сеть и службы. Репозитории включают desktop- и серверное ПО.', desktop: 'Официально доступны KDE Plasma и GNOME, также возможны другие среды. Настройку можно вести как через графические инструменты, так и из консоли.', strengths: 'Предсказуемая модель, удобное администрирование и знакомый RPM-стек без rolling-обновлений.', cautions: 'Актуальность и срок жизни релизов меняются; сверяйте официальную дорожную карту. Для самых свежих desktop-пакетов лучше изучить Tumbleweed.', start: 'Проверьте текущую матрицу поддержки и выберите подходящую среду. YaST удобен, но полезно понимать, какие конфигурационные файлы изменяет выбранный инструмент.', related: [6, 25, 3] },
			{ name: 'openSUSE Aeon', family: 'RPM / SUSE', intro: 'Атомарный настольный проект openSUSE, построенный вокруг автоматических обновлений и разделения базовой системы и пользовательских приложений.', model: 'Образные обновления применяются целиком и рассчитаны на автоматизацию; перед установкой проверяйте актуальный статус проекта и рекомендации по восстановлению.', packages: 'Flatpak используется для desktop-приложений, Distrobox — для отдельных Linux-окружений. Базовые пакеты и изменения системы управляются по модели Aeon.', desktop: 'Предназначен для современного GNOME desktop. Стандартные системные изменения не предполагают свободную установку любого RPM в корневую систему.', strengths: 'Автоматическое обслуживание, изолированные приложения и сниженная потребность вручную управлять базовой системой.', cautions: 'Проект и его документация могут меняться; это не универсальная замена классической openSUSE. Специальные системные драйверы и рабочие процессы следует проверить заранее.', start: 'Изучите текущие заметки Aeon и проверьте поддержку GPU, VPN, приложений и корпоративных средств управления до переноса основного компьютера.', related: [19, 6, 9] },
			{ name: 'Manjaro', family: 'Arch-based', intro: 'Настольный дистрибутив на базе Arch с графической установкой и собственными репозиториями. Manjaro старается сделать rolling-систему доступнее для повседневного использования.', model: 'Rolling-релизы: обновления поступают пакетами после прохождения собственного цикла тестирования. Это отличается от прямого использования репозиториев Arch.', packages: 'Pacman и графические инструменты; доступ к AUR возможен, но пользовательские рецепты остаются на ответственности пользователя. Некоторые дополнительные форматы тоже доступны.', desktop: 'Предлагаются редакции с KDE Plasma, GNOME и Xfce. Установщик Calamares и утилиты настройки упрощают первоначальную настройку.', strengths: 'Простой вход в Arch-подобную систему, выбор сред и удобные графические средства управления драйверами и ядрами.', cautions: 'Задержка пакетов относительно Arch не исключает rolling-проблем. Сторонние AUR-пакеты могут не совпасть с версиями в репозиториях Manjaro.', start: 'Читайте объявления перед крупными обновлениями и держите резервную копию. Не следуйте автоматически ArchWiki, если инструкция предполагает точные версии Arch-пакетов.', related: [4, 27, 28] },
			{ name: 'EndeavourOS', family: 'Arch-based', intro: 'Близкий к Arch Linux настольный дистрибутив с удобным установщиком и сообществом. Он помогает быстрее получить работающий desktop, не превращая систему в полностью автоматизированный продукт.', model: 'Rolling-модель Arch: пакеты поступают из близких к Arch источников. Пользователь обслуживает систему и следит за объявлениями об обновлениях.', packages: 'Pacman и репозитории Arch плюс инструменты EndeavourOS; доступен AUR, где рецепты поддерживаются сообществом, а не проектом EndeavourOS.', desktop: 'Онлайн-установщик предлагает набор популярных сред и оконных менеджеров. После установки остаётся обычная гибкая Arch-подобная система.', strengths: 'Меньше ручных шагов при установке, близкая связь с Arch и возможность получить чистый desktop без большого числа предустановленных компонентов.', cautions: 'Удобный установщик не снимает обязанность обслуживать rolling-систему. Многие задачи потребуют самостоятельного чтения ArchWiki.', start: 'Убедитесь, что понимаете обновления pacman и обслуживание загрузчика. Используйте официальную документацию EndeavourOS для собственных инструментов и ArchWiki для общих компонентов.', related: [4, 26, 29] },
			{ name: 'CachyOS', family: 'Arch-based', intro: 'Производительный Arch-подобный rolling-дистрибутив, предлагающий оптимизированные пакеты и инструменты установки для desktop и игр.', model: 'Rolling-обновления на основе Arch с собственными репозиториями и настройками. Проверяйте актуальные рекомендации проекта, особенно перед сменой ядра или профиля.', packages: 'Pacman и дополнительные репозитории CachyOS; возможны AUR и Flatpak. Оптимизированные сборки предназначены для поддерживаемых архитектур и процессоров.', desktop: 'Установщик помогает выбрать среду, ядро и дополнительные игровые компоненты. Конфигурация рассчитана на производительный desktop, но её можно менять.', strengths: 'Свежий стек, упор на производительность и готовые игровые инструменты без необходимости собирать всё вручную.', cautions: 'Оптимизация не гарантирует ускорения каждого приложения. Собственные пакеты и частые обновления добавляют источники изменений; проблемы нужно уметь диагностировать.', start: 'Сравните систему с обычным Arch на своём железе, сохраните стандартное загрузочное ядро как вариант восстановления и тестируйте изменения производительности по измерениям.', related: [4, 28, 49] },
			{ name: 'Garuda Linux', family: 'Arch-based', intro: 'Arch-подобный rolling-дистрибутив с готовыми настольными образами, выразительным оформлением и игровыми инструментами. Он объединяет множество компонентов в настроенную систему.', model: 'Rolling-релизы, основанные на Arch и репозиториях проекта. Снимки Btrfs часто входят в рекомендуемую конфигурацию, но не заменяют внешнюю резервную копию.', packages: 'Pacman, репозитории Garuda, графические утилиты и при необходимости AUR. Снимки системы могут упростить откат после неудачного обновления.', desktop: 'Доступно несколько оформленных редакций, включая KDE Plasma и варианты с другими средами. Игровые инструменты и дополнительные настройки отличаются между образами.', strengths: 'Богатая готовая комплектация, яркий desktop и инструменты восстановления, полезные для экспериментирующей системы.', cautions: 'Много предустановленного ПО может быть избыточным; rolling-обновления требуют обслуживания. Снимок на том же диске не спасает от отказа накопителя.', start: 'Выберите минимально подходящую редакцию, проверьте свободное место для Btrfs-снимков и настройте отдельную копию пользовательских данных.', related: [26, 27, 4] },
			{ name: 'Artix Linux', family: 'Arch-based', intro: 'Arch-подобная rolling-система для пользователей, которые предпочитают альтернативы systemd. Можно выбрать другой менеджер служб и построить минимальную конфигурацию.', model: 'Rolling-релиз на основе Arch. Важны согласованность выбранного init-системного набора и чтение инструкций Artix при обновлении.', packages: 'Pacman и репозитории Artix; доступ к части Arch-пакетов требует специальных репозиториев и осторожного соблюдения рекомендаций проекта.', desktop: 'Можно установить KDE, Xfce, тайлинговый WM или минимальную консольную систему. Образы и варианты init отличаются, выбор влияет на набор служб.', strengths: 'Выбор OpenRC, runit, s6 или других поддерживаемых вариантов вместо systemd и возможность минималистичной настройки.', cautions: 'Некоторое ПО и инструкции предполагают systemd. Смешивание репозиториев или компонентов от разных init-систем может привести к трудно диагностируемым конфликтам.', start: 'Сначала выберите init-систему и внимательно следуйте официальному руководству Artix. Перед добавлением Arch-репозиториев проверьте совместимость пакетов.', related: [4, 32, 34] },
			{ name: 'Gentoo', family: 'Независимый', intro: 'Гибкий дистрибутив, где пользователь может собирать значительную часть системы из исходного кода и задавать функции пакетов. Он особенно интересен для обучения и тонкого контроля.', model: 'Rolling-дерево пакетов; обновления и пересборки выполняются пользователем. Профили и стабильность отдельных архитектур влияют на доступность версий.', packages: 'Portage и ebuild-рецепты; USE-флаги управляют включаемыми возможностями. Сборка может занимать время и требует планирования ресурсов.', desktop: 'Возможны практически любые среды, но их установка и настройка могут потребовать сборки множества зависимостей. Минимальная консольная система также естественна для Gentoo.', strengths: 'Тонкий контроль функций пакетов, глубокое понимание зависимостей и гибкая настройка целевой системы.', cautions: 'Сборки требуют времени и ресурсов, особенно для браузеров и крупных desktop-приложений. Установка и восстановление предполагают уверенную работу в командной строке.', start: 'Начните с официального Handbook и сначала соберите минимальную систему в виртуальной машине. Продумайте время сборки, место для исходников и стратегию резервного копирования.', related: [4, 32, 31] },
			{ name: 'Void Linux', family: 'Независимый', intro: 'Независимый rolling-дистрибутив с собственным менеджером пакетов и init-системой runit. Он популярен у тех, кому нужна относительно компактная и понятная система без systemd.', model: 'Rolling-обновления через репозитории Void. Пакеты и системные службы сопровождаются проектом независимо от Arch и Debian.', packages: 'XBPS устанавливает и обновляет бинарные пакеты; xbps-src позволяет собирать пакеты. Официальные репозитории предлагают glibc- и musl-варианты.', desktop: 'Есть базовые образы и варианты с распространёнными desktop-средами. runit управляет службами через простую структуру каталогов и ссылки.', strengths: 'Независимость, небольшой базовый слой и отсутствие systemd по умолчанию.', cautions: 'Сообщество и документация меньше, чем у Debian или Ubuntu; совместимость с инструкциями других дистрибутивов ограничена. Некоторые приложения ожидают glibc.', start: 'Выберите libc-вариант осознанно, проверьте совместимость нужных приложений и изучите руководство Void по службам и пакетам до установки на основной компьютер.', related: [32, 31, 4] },
			{ name: 'Alpine Linux', family: 'Независимый', intro: 'Компактный независимый дистрибутив, известный использованием musl libc и OpenRC. Часто применяется в контейнерах и минимальных серверных средах.', model: 'Стабильные ветки с обновлениями безопасности и отдельные edge-репозитории. Не смешивайте ветки без понимания последствий для системы.', packages: 'APK — быстрый менеджер бинарных пакетов Alpine. Системные библиотеки и инструменты отличаются от типичной glibc-системы.', desktop: 'Основной профиль — минимальная серверная или контейнерная среда. Графический desktop установить можно, но это не главный готовый сценарий проекта.', strengths: 'Небольшой размер, простая базовая система и удобство для минимальных контейнерных образов.', cautions: 'Некоторые бинарные программы рассчитаны на glibc и требуют совместимого слоя или отдельной сборки. Малый образ сам по себе не означает меньшую поверхность уязвимостей.', start: 'Сначала проверьте приложение именно на Alpine, а не только на Linux вообще. Для контейнера фиксируйте версию базового образа и регулярно пересобирайте его с обновлениями.', related: [32, 31, 5] },
			{ name: 'Slackware', family: 'Независимый', intro: 'Один из старейших сохраняющихся Linux-дистрибутивов с традиционной Unix-подобной организацией. Slackware предпочитает простые конфигурационные файлы и меньше автоматизации.', model: 'Классические выпуски сочетают стабильную базу и обновления поддерживаемых веток. Уточняйте статус версии и источники пакетов для текущего выпуска.', packages: 'Используются пакеты tgz/txz и инструменты pkgtool; зависимости не разрешаются так же автоматически, как в APT или DNF. Дополнительное ПО часто требует сторонних средств.', desktop: 'Доступны KDE Plasma и Xfce в зависимости от выпуска; систему можно настроить для консольного или графического использования.', strengths: 'Прозрачная структура, мало скрытой автоматики и хорошая возможность изучать ручное администрирование Unix-подобной системы.', cautions: 'Установка сторонних приложений и управление зависимостями требуют больше ручной работы. Для новичка меньше привычных графических подсказок.', start: 'Изучите официальную книгу Slackware, порядок обновления и рекомендуемые источники пакетов. Сначала попробуйте систему в виртуальной машине.', related: [31, 32, 4] },
			{ name: 'Mageia', family: 'Независимый', intro: 'Community-дистрибутив с графическими средствами настройки и выбором desktop-окружений. Проект продолжает традицию доступного RPM-дистрибутива Mandriva.', model: 'Фиксированные выпуски; поддержка и частота релизов зависят от сообщества. Проверяйте актуальную информацию о сроке сопровождения версии.', packages: 'RPM-пакеты управляются DNF или инструментами Mageia; системные настройки можно выполнять через графическую панель Mageia Control Center.', desktop: 'Доступны KDE Plasma, GNOME, Xfce и другие среды. Установщик позволяет выбрать состав системы.', strengths: 'Графические инструменты администрирования и широкий выбор сред без необходимости привязываться к экосистеме Ubuntu.', cautions: 'Сообщество и количество свежих сторонних руководств меньше, чем у крупнейших дистрибутивов. Убедитесь, что текущий релиз активно поддерживается.', start: 'Проверьте, что необходимые программы есть в репозиториях текущей версии. Для редкого оборудования сначала загрузите live-образ и протестируйте драйверы.', related: [5, 24, 1] },
			{ name: 'MX Linux', family: 'Debian', intro: 'Настольный дистрибутив на базе Debian Stable с собственными утилитами и нацеленностью на удобную повседневную работу. Он сочетает консервативную базу с готовым набором настроек.', model: 'Основан на стабильной ветке Debian; версии ядра и приложений зависят от конкретного выпуска MX и выбранных репозиториев.', packages: 'APT и пакеты Debian, дополненные репозиториями MX и графическими MX Tools. Дополнительные источники следует добавлять выборочно.', desktop: 'Основные варианты используют Xfce, KDE Plasma или Fluxbox. MX Tools помогают создавать live-USB, настраивать загрузку и выполнять системные задачи.', strengths: 'Полезные графические утилиты, низкий порог входа и варианты для устройств с ограниченными ресурсами.', cautions: 'Собственные инструменты MX отличаются от стандартного Debian. Сторонние репозитории могут нарушить согласованность консервативной базы.', start: 'Выберите среду под объём памяти и привычный интерфейс. Проверьте live-режим и узнайте, как MX Tools выполняют резервное копирование и обновление.', related: [5, 37, 1] },
			{ name: 'antiX', family: 'Debian', intro: 'Лёгкий Debian-ориентированный дистрибутив, предназначенный в том числе для старого оборудования. В стандартной конфигурации он обходится без systemd.', model: 'Фиксированные выпуски, основанные на Debian; доступные ветки и обновления зависят от текущего проекта.', packages: 'APT и пакеты Debian с собственными инструментами antiX. Часть стандартных сервисов заменена лёгкими альтернативами.', desktop: 'Вместо тяжёлой полной среды используются IceWM, Fluxbox и другие лёгкие компоненты. Это экономит ресурсы, но отдельные функции нужно настраивать самостоятельно.', strengths: 'Может работать на старых компьютерах, предлагает live-запуск и независимые от systemd варианты системных компонентов.', cautions: 'Старый компьютер всё равно может не справляться с современными веб-сайтами. Интерфейс и подключение устройств требуют больше ручной настройки, чем в mainstream desktop.', start: 'Проверьте требования конкретного выпуска, поддержку Wi-Fi и фактическую производительность браузера. Используйте live-режим и сначала сохраните данные со старого компьютера.', related: [37, 7, 5] },
			{ name: 'Puppy Linux', family: 'Независимый', intro: 'Семейство очень компактных Linux-систем, рассчитанных на запуск с USB, быстрый старт и скромное оборудование. Разные варианты Puppy могут основываться на разных upstream-дистрибутивах.', model: 'Выпуски и база отличаются между вариантами Puppy. Перед установкой выясните, на какой системе основана конкретная сборка и как она получает обновления.', packages: 'Инструменты пакетов зависят от выбранной базы: встречаются совместимость с Ubuntu, Debian или другими системами и собственные форматы Puppy.', desktop: 'Используются лёгкие оконные менеджеры и небольшой комплект приложений; система может запускаться из памяти и сохранять изменения на USB.', strengths: 'Небольшой размер, удобный live-запуск и возможность оживить некоторые старые устройства.', cautions: 'Разные варианты Puppy не образуют единую совместимую платформу. Маленькая система может иметь ограничения безопасности и поддержки современных программ.', start: 'Выберите активно поддерживаемый вариант с понятной базой пакетов. Не используйте старый образ для чувствительных данных, если он не получает обновления безопасности.', related: [37, 36, 7] },
			{ name: 'Kali Linux', family: 'Debian', intro: 'Специализированный дистрибутив Offensive Security для аудита безопасности и тестирования на проникновение. Это набор инструментов для профессиональной работы, а не универсальный desktop для новичка.', model: 'Rolling-ветка с обновляемыми инструментами и ядром. Для воспроизводимой работы используйте официальные образы и документируйте версии инструментов.', packages: 'APT и репозитории Kali; доступны метапакеты для разных категорий security-инструментов. Источники Kali не следует бездумно добавлять в обычную Ubuntu или Debian-систему.', desktop: 'Есть графические образы, live-режим и варианты для виртуальных машин, контейнеров и специализированных устройств. Многие инструменты эффективнее использовать из терминала.', strengths: 'Широкая подборка средств аудита, официальные образы и удобство лабораторной работы в виртуальной машине.', cautions: 'Использование инструментов допустимо только на системах, на которые у вас есть разрешение. Привилегированные утилиты и rolling-пакеты требуют ответственного обращения.', start: 'Начните с официального курса и изолированной лаборатории. Не сканируйте чужие сети и не храните рабочие учётные данные в тестовой виртуальной машине.', related: [39, 40, 5] },
			{ name: 'Parrot OS', family: 'Debian', intro: 'Debian-ориентированная система с редакциями для кибербезопасности, разработки и приватности. В отличие от Kali, проект предлагает и более универсальный desktop-вариант.', model: 'Релизы и обновления зависят от редакции и текущей политики Parrot. Проверяйте поддержку и происхождение конкретного образа перед использованием.', packages: 'APT и репозитории Parrot; security-редакция включает специализированные инструменты, а Home-редакция имеет более общий набор программ.', desktop: 'MATE используется в типичных образах Parrot. Система может работать как обычный desktop, но состав security-редакции предназначен для конкретных задач.', strengths: 'Выбор между рабочей средой и security-инструментами, встроенные средства приватности и знакомый Debian-стек.', cautions: 'Набор инструментов не заменяет обучение и разрешение на тестирование. Для обычного домашнего компьютера security-редакция может быть избыточной.', start: 'Выберите редакцию по задаче и отделите лабораторные среды от повседневных учётных записей. Проверяйте актуальность инструментов и условия безопасного применения.', related: [38, 41, 5] },
			{ name: 'Tails', family: 'Debian', intro: 'Live-система для приватности, предназначенная для работы с USB и снижения следов на локальном компьютере. Сетевой трафик направляется через Tor в соответствии с архитектурой проекта.', model: 'Запускается как отдельная live-среда и регулярно обновляется. Постоянное хранилище можно включить для выбранных данных, но оно требует аккуратного управления.', packages: 'Система основана на Debian и включает ограниченный набор тщательно отобранных приложений. Установка произвольных программ не является основным рабочим сценарием.', desktop: 'Готовый GNOME desktop с преднастроенными средствами Tor и приватности. Сценарий использования отличается от обычной установленной ОС.', strengths: 'Удобный специализированный live-workflow, сетевой маршрут через Tor и снижение локального следа при корректном использовании.', cautions: 'Tails не защищает от всех угроз и не гарантирует анонимность; поведение пользователя и компрометация устройства имеют значение. Некоторые сайты ограничивают Tor.', start: 'Изучите официальную модель угроз и инструкции обновления. Создайте резервную копию постоянного хранилища и не открывайте документы, если не понимаете риск сетевых обращений.', related: [41, 42, 5] },
			{ name: 'Qubes OS', family: 'Fedora / Xen', intro: 'Операционная система, построенная вокруг изоляции задач в отдельных виртуальных машинах. Qubes подходит пользователям, которым важнее разделение рабочих контекстов, чем минимальные требования к ресурсам.', model: 'Основа использует гипервизор Xen и изолированные домены; обновления системы и шаблонов применяются раздельно. Следите за поддерживаемыми версиями и рекомендациями проекта.', packages: 'Приложения работают в шаблонных виртуальных машинах на базе Fedora, Debian и других поддерживаемых систем. Обновление шаблона влияет на связанные с ним qubes.', desktop: 'Пользовательский интерфейс объединяет окна изолированных сред и визуально маркирует их. Совместимое оборудование и аппаратная виртуализация обязательны.', strengths: 'Сильное разделение задач, сетевых контекстов и доверенных сред при правильной конфигурации.', cautions: 'Высокие требования к памяти и совместимости; не все ноутбуки поддерживаются. Виртуализация повышает безопасность, но не устраняет ошибки пользователя и прошивок.', start: 'Проверьте список совместимого оборудования и настройку IOMMU до установки. Сделайте отдельные qubes для разных уровней доверия и регулярно обновляйте шаблоны.', related: [42, 43, 41] },
			{ name: 'Whonix', family: 'Debian', intro: 'Система приватности, которая разделяет приложения и сетевой шлюз Tor на отдельные виртуальные машины. Такая архитектура помогает ограничить прямые сетевые утечки приложений.', model: 'Обычно используется как набор виртуальных машин со специализированными образами Gateway и Workstation. Обновления следует применять к обеим частям по рекомендациям проекта.', packages: 'Основа Debian; готовые образы поставляются для поддерживаемых платформ виртуализации. Установка в виртуальной среде требует надёжного гипервизора и корректной сети.', desktop: 'Рабочая среда запускается в отдельной виртуальной машине, шлюз работает отдельно. Возможна интеграция с Qubes OS для более глубокой изоляции.', strengths: 'Разделение сетевого шлюза и приложений, готовая конфигурация Tor и понятное разграничение компонентов.', cautions: 'Whonix не скрывает все метаданные и не спасает от деанонимизации через личные аккаунты или ошибочные действия. Виртуализация зависит от хост-системы.', start: 'Изучите модель угроз, используйте только официальные образы и держите хост-систему обновлённой. Не считайте запуск Whonix гарантией анонимности.', related: [41, 42, 39] },
			{ name: 'Solus', family: 'Независимый', intro: 'Независимый настольный дистрибутив со своим репозиторием и собственной средой Budgie. Проект фокусируется на готовом desktop, а не на широком наборе серверных редакций.', model: 'Независимая модель выпусков и обновлений; график и жизненный цикл зависят от текущей практики проекта. Проверьте статус релизов и обновлений перед выбором.', packages: 'eopkg управляет пакетами из репозиториев Solus. Это отдельная экосистема, поэтому пакеты Debian, Fedora или Arch напрямую не подходят.', desktop: 'Доступны варианты с Budgie, GNOME, KDE Plasma и Xfce в зависимости от актуального предложения проекта.', strengths: 'Целостный desktop, собственная среда Budgie и самостоятельный набор тщательно отобранных программ.', cautions: 'Размер экосистемы и число сторонних инструкций меньше, чем у Ubuntu или Fedora. Проверяйте, есть ли нужное ПО в репозитории или Flatpak.', start: 'Убедитесь, что проект поддерживает текущий выпуск, и протестируйте обновления на live/второй установке. Сохраните список сторонних приложений и данных отдельно.', related: [12, 1, 3] },
			{ name: 'Deepin', family: 'Debian', intro: 'Настольный дистрибутив на базе Debian с собственной визуально цельной средой DDE и набором приложений. Он ориентирован прежде всего на графический пользовательский опыт.', model: 'Фиксированные выпуски; сроки сопровождения и доступность репозиториев зависят от текущей версии и региона.', packages: 'Debian-подобная база и собственные источники Deepin; доступны DEB-пакеты и фирменный магазин приложений.', desktop: 'Deepin Desktop Environment включает док, панель управления и приложения проекта. Графический стек и интеграция тесно связаны с выбранным выпуском.', strengths: 'Согласованный внешний вид, удобная панель управления и комплект настольных приложений.', cautions: 'Проверьте сроки обновлений, региональную доступность репозиториев и политику конфиденциальности. Глубокая интеграция среды может отличаться от стандартного Debian.', start: 'Проверьте происхождение образа и действующую поддержку релиза. Перед установкой на основной компьютер протестируйте графику, локализацию и работу нужных приложений.', related: [12, 1, 14] },
			{ name: 'Vanilla OS', family: 'Ubuntu / Debian', intro: 'Настольный проект, экспериментирующий с атомарными обновлениями и разделением приложений. Его подход отличается от обычной Ubuntu и рассчитан на пользователей, готовых освоить новый workflow.', model: 'Образная модель обновления и управляемые системные изменения; детали менялись между версиями проекта. Перед установкой читайте документацию конкретного выпуска.', packages: 'Приложения могут устанавливаться в изолированных контейнерах или универсальных форматах; базовая система управляется специальными средствами Vanilla OS.', desktop: 'GNOME desktop с механизмами изоляции приложений и системного обслуживания. Доступные инструменты зависят от актуальной версии.', strengths: 'Разделение приложений и базовой системы, автоматизация обслуживания и интересный подход к воспроизводимому desktop.', cautions: 'Проект активно развивается, поэтому документация и workflow могут меняться. Не переносите инструкции обычной Ubuntu без проверки совместимости.', start: 'Уточните статус текущего релиза, требования к установке и способ восстановления. Сначала опробуйте систему в виртуальной машине или на отдельном накопителе.', related: [19, 25, 8] },
			{ name: 'blendOS', family: 'Arch-based', intro: 'Экспериментальная атомарная система, предлагающая контейнеризированные среды и несколько экосистем пакетов. Она ориентирована на пользователей, желающих совмещать инструменты разных дистрибутивов.', model: 'Неизменяемая/образная модель и быстро меняющиеся версии проекта. Перед выбором особенно важно проверить, что проект и выбранный выпуск активно поддерживаются.', packages: 'Среды и приложения могут предоставляться через контейнеры и Flatpak; детали управления зависят от поколения blendOS.', desktop: 'Desktop строится на Linux-графическом стеке с интеграцией изолированных окружений. Текущие доступные среды и системные требования проверьте в официальной документации.', strengths: 'Идея использования разных пользовательских экосистем в одной системе и отделение базовой ОС от приложений.', cautions: 'Экспериментальный характер и изменения проекта создают больший риск несовместимости и пробелов в документации, чем у зрелых mainstream-дистрибутивов.', start: 'Не используйте как единственную систему для критичных задач без проверки текущего статуса, резервного копирования и теста восстановления.', related: [8, 19, 4] },
			{ name: 'Nobara', family: 'Fedora', intro: 'Fedora-производный настольный проект с патчами и наборами программ для игр, стриминга и создания контента. Он стремится сократить объём ручной настройки мультимедийной системы.', model: 'Выпуски следуют за базой Fedora, но сопровождение и изменения управляются проектом Nobara. Проверяйте актуальность образа и порядок обновления в документации Nobara.', packages: 'Используются RPM/DNF и репозитории проекта; могут быть включены дополнительные мультимедийные компоненты и настройки, которых нет в чистой Fedora.', desktop: 'Доступны готовые desktop-образы, обычно с KDE Plasma или GNOME. Конкретный состав и поддерживаемые видеокарты отличаются по выпуску.', strengths: 'Игровые и медиапатчи, подготовленная среда для стриминга и меньше предварительной ручной настройки.', cautions: 'Небольшой проект зависит от ресурсов сопровождающих; цикл поддержки не следует автоматически считать равным Fedora. Для специфического оборудования могут потребоваться обновлённые инструкции.', start: 'Уточните текущую базовую версию и поддерживаемый путь обновления. Проверьте нужные игры, античиты, GPU и кодеки до переноса основной рабочей среды.', related: [3, 9, 10] },
			{ name: 'Oracle Linux', family: 'RPM / Oracle', intro: 'Корпоративная Linux-система Oracle для серверов, облачной инфраструктуры и приложений, тесно связанных с продуктами Oracle. Она предлагает RHEL-совместимую пользовательскую среду.', model: 'Фиксированные корпоративные выпуски с длительной поддержкой. Доступность обновлений и сервисов зависит от выбранного канала и условий поддержки Oracle.', packages: 'RPM и DNF/Yum; предлагаются варианты ядра, включая Unbreakable Enterprise Kernel и совместимое с RHEL ядро.', desktop: 'Типичный сценарий — сервер без графической среды, виртуальная машина или облачный экземпляр. Графическая установка не является основным преимуществом.', strengths: 'Интеграция с инфраструктурой Oracle, корпоративная поддержка и выбор серверного ядра.', cautions: 'Выбирайте систему только при соответствии требованиям приложения и поддержки. Совместимость с RHEL не означает идентичности всех пакетов и поведения.', start: 'Сверьте матрицу сертификации своего приложения, тип ядра и контракт поддержки. Настройте обновления безопасности и контролируемые тесты перед обновлением production.', related: [22, 20, 21] },
			{ name: 'Chimera Linux', family: 'Независимый', intro: 'Современный независимый Linux-дистрибутив с нестандартным системным стеком: musl, LLVM и альтернативными базовыми компонентами. Он интересен опытным пользователям, которым важны технические эксперименты.', model: 'Проект развивается самостоятельно и использует rolling-подход. Перед установкой проверьте актуальный статус, поддерживаемую архитектуру и документацию текущей версии.', packages: 'Собственный менеджер пакетов и репозитории; базовая libc и инструментарий отличаются от большинства mainstream-дистрибутивов.', desktop: 'Система предназначена для опытной настройки; доступность графических стеков и приложений зависит от архитектуры и текущего состояния портирования.', strengths: 'Независимая архитектура, современный компиляторный стек и возможность изучать альтернативы привычным компонентам Linux.', cautions: 'Совместимость приложений и сторонних бинарных файлов может быть ограничена. Экосистема и объём помощи заметно меньше, чем у Debian, Fedora и Arch.', start: 'Начните с виртуальной машины и проверьте, что необходимые приложения собираются или доступны. Не переносите привычные инструкции glibc-дистрибутивов без адаптации.', related: [32, 31, 4] }
